name: Audit Awin catalog candidates

on:
  workflow_dispatch:
    inputs:
      merchant_id:
        description: "Awin target to audit"
        required: true
        default: "benz24"
        type: choice
        options:
          - benz24
          - artsauna
          - home-deluxe
          - intergard

permissions:
  contents: write

concurrency:
  group: awin-catalog-candidates
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      AWIN_FEED_LIST_URL: ${{ secrets.AWIN_FEED_LIST_URL }}
      AWIN_CANDIDATE_MERCHANT_ID: ${{ inputs.merchant_id }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Require feed-list secret
        shell: bash
        run: |
          if [ -z "$AWIN_FEED_LIST_URL" ]; then
            echo "AWIN_FEED_LIST_URL is not configured." >&2
            exit 1
          fi
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run awin:test
      - run: npm run awin:candidates
      - name: Commit sanitized candidate report
        shell: bash
        run: |
          git config user.name "selectyoursauna-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/awin-catalog-candidates*.json
          git diff --cached --quiet && echo "No candidate changes." && exit 0
          git commit -m "chore(data): audit Awin catalog candidates"
          git push
