name: Discover approved Awin product feeds

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: awin-feed-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    env:
      AWIN_FEED_LIST_URL: ${{ secrets.AWIN_FEED_LIST_URL }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Require feed-list secret
        shell: bash
        run: |
          if [ -z "$AWIN_FEED_LIST_URL" ]; then
            echo "AWIN_FEED_LIST_URL is not configured." >&2
            exit 1
          fi
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run awin:discover
      - name: Commit sanitized discovery report
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- data/awin-feed-discovery.json)" ]; then
            echo "No discovery changes."
            exit 0
          fi
          git config user.name "selectyoursauna-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/awin-feed-discovery.json
          git commit -m "chore(data): discover approved Awin feeds"
          git push
