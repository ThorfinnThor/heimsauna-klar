name: Audit Awin feed relevance

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: awin-feed-relevance
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      AWIN_FEED_LIST_URL: ${{ secrets.AWIN_FEED_LIST_URL }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Require feed-list secret
        shell: bash
        run: |
          if [ -z "$AWIN_FEED_LIST_URL" ]; then
            echo "AWIN_FEED_LIST_URL is not configured." >&2
            exit 1
          fi
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/awin/audit-feed-relevance.mjs
      - name: Commit sanitized relevance report
        shell: bash
        run: |
          git config user.name "selectyoursauna-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/awin-feed-relevance.json
          git diff --cached --quiet && echo "No relevance changes." && exit 0
          git commit -m "chore(data): audit Awin feed relevance"
          git push
